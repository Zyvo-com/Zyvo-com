    .marquee-reverse { animation: marquee 40s linear infinite reverse; }

    [data-reveal].is-visible { opacity: 1; }
    [data-reveal] > * { transform: translateY(48px); opacity:0; transition: transform .7s cubic-bezier(.2,.7,.2,1), opacity .7s ease-out; }
    [data-reveal].is-visible > * { transform: translateY(0); opacity:1; }
    [data-reveal].is-visible > *:nth-child(1) { transition-delay: 0ms }
    [data-reveal].is-visible > *:nth-child(2) { transition-delay: 100ms }
    [data-reveal].is-visible > *:nth-child(3) { transition-delay: 200ms }
    [data-reveal].is-visible > *:nth-child(4) { transition-delay: 300ms }
    [data-reveal].is-visible > *:nth-child(5) { transition-delay: 400ms }
    [data-reveal].is-visible > *:nth-child(6) { transition-delay: 500ms }
    [data-reveal].is-visible > *:nth-child(7) { transition-delay: 600ms }
    [data-reveal].is-visible > *:nth-child(8) { transition-delay: 700ms }
